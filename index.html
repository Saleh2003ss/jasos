<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8B7CF6" />
  <meta name="description" content="بازی گروهی جاسوس؛ یک کلمه مخفی، چند بازیکن و یک جاسوس که باید پیدایش کنید." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/spy.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>جاسوس | بازی گروهی</title>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="ambient ambient-three"></div>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="رفتن به صفحه اصلی">
        <span class="brand-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5C12.8 5 4 13.5 4 24s8.8 19 20 19 20-8.5 20-19S35.2 5 24 5Z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 24c4.5-6.4 9.1-9.6 14-9.6S33.5 17.6 38 24c-4.5 6.4-9.1 9.6-14 9.6S14.5 30.4 10 24Z" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="24" cy="24" r="4.5" fill="currentColor"/></svg></span>
        <span class="brand-copy"><strong>جاسوس</strong><small>بازی گروهی</small></span>
      </button>
      <div class="top-actions">
        <button class="icon-button" data-action="history" aria-label="تاریخچه" title="تاریخچه">▤</button>
        <button class="icon-button" data-action="settings" aria-label="تنظیمات" title="تنظیمات">⚙</button>
      </div>
    </header>
    <main id="app" class="main-content" aria-live="polite"></main>
    <footer class="footer"><span class="footer-dot"></span> ساخته‌شده برای دورهمی‌های به‌یادماندنی</footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
